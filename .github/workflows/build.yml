name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: bash build-app.sh
      - name: Zip app
        run: cd dist && ditto -c -k --keepParent "ACOM Control.app" ACOM-Control-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ACOM-Control-macOS
          path: dist/ACOM-Control-macOS.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ACOM-Control-macOS.zip
